name: Unpack BL3 Pak

on:
  workflow_dispatch:
    inputs:
      pak_url:
        description: 'Direct download URL of the .pak file'
        required: true
      pak_name:
        description: 'Original name of the pak file'
        required: true
        default: 'pakchunk89-WindowsNoEditor.pak'
      aes_key:
        description: 'AES decryption key'
        required: false
        default: '0x115EE4F8C625C792F37A503308048E79726E512F0BF8D2AD7C4C87BC5947CBA7'
      artifact_name:
        description: 'Name for the output artifact'
        required: true
        default: 'unpacked-paks'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the .pak file
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ github.event.inputs.pak_url }}" -OutFile "input.pak" -UseBasicParsing
          Write-Host "Downloaded: $((Get-Item input.pak).Length / 1MB) MB"

      - name: Download repak (Standalone Rust UE Pak tool)
        shell: pwsh
        run: |
          $latestUrl = "https://github.com/trumank/repak/releases/latest/download/repak_cli-x86_64-pc-windows-msvc.zip"
          $fallbackUrl = "https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-pc-windows-msvc.zip"
          try {
              Invoke-WebRequest -Uri $latestUrl -OutFile "repak.zip" -UseBasicParsing
          } catch {
              Write-Host "Latest release download failed, trying fallback URL..."
              Invoke-WebRequest -Uri $fallbackUrl -OutFile "repak.zip" -UseBasicParsing
          }
          Expand-Archive -Path "repak.zip" -DestinationPath "repak" -Force
          $exe = Get-ChildItem -Path "repak" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "repak executable not found" }
          echo "REPAK_PATH=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Host "repak tool found at: $($exe.FullName)"

      - name: Show repak version
        shell: pwsh
        run: |
          & "$env:REPAK_PATH" --version
          & "$env:REPAK_PATH" --help

      - name: Extract the pak
        shell: pwsh
        run: |
          $key = "${{ github.event.inputs.aes_key }}"
          New-Item -ItemType Directory -Force -Path "unpacked" | Out-Null
          if ($key) {
              & "$env:REPAK_PATH" --aes-key "$key" unpack "input.pak" -o "unpacked"
          } else {
              & "$env:REPAK_PATH" unpack "input.pak" -o "unpacked"
          }
          if ($LASTEXITCODE -ne 0) { throw "repak exited with code $LASTEXITCODE" }
          Write-Host "Extraction complete."

      - name: Zip the output
        shell: pwsh
        run: |
          Compress-Archive -Path "unpacked\*" -DestinationPath "result.zip" -Force
          Write-Host "Zipped: $((Get-Item result.zip).Length / 1MB) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: result.zip
          retention-days: 7
